<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>PoolDN App Icon</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1f262a"/>
      <stop offset="100%" stop-color="#0c1012"/>
    </radialGradient>
    <radialGradient id="ball" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e7ff4d"/>
      <stop offset="55%" stop-color="#d0f30d"/>
      <stop offset="100%" stop-color="#a8c70b"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#glow)">
    <circle cx="512" cy="512" r="368" fill="url(#ball)"/>
  </g>
  <text
    x="512"
    y="512"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Mona Sans', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="512"
    letter-spacing="-26"
    fill="#0c1012"
  >8</text>
</svg>
